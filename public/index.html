<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Theme-aware favicon, mirroring Navbar.js's own dark-mode logic exactly
      (filter: brightness(0) invert(1) applied only when theme.palette.mode
      === 'dark' - see src/components/layout/Navbar.js). Same source asset
      (pictures/logo.png), just pre-rendered white for dark browser tabs so
      it stays visible there too - a plain white favicon disappears on light
      tabs, so a single static icon can't satisfy both. Browsers without
      prefers-color-scheme favicon support (e.g. older Safari) fall back to
      the plain default below.
    -->
    <link rel="icon" href="%PUBLIC_URL%/pictures/logo.png" />
    <link
      rel="icon"
      href="%PUBLIC_URL%/pictures/logo-white.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <!--
      DM Sans (used app-wide, see src/App.css's font-family) - loaded as a
      real <link>, not an `@import` inside App.css. That `@import` used to
      trigger the browser's "@import rules can't be after other rules"
      warning, because App.css loads after src/styles/global.css in the
      bundle, so its @import was never first in the final cascade - the
      exact case CSS forbids. A <link> in <head> has no such ordering
      requirement.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="BanglaGhor - Find your next home in Bangladesh"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/pictures/logo.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>BanglaGhor</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
